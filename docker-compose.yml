services:
  postgres:
    image: postgres:16-alpine
    container_name: chess-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess
    ports:
      - '5432:5432'
    volumes:
      - chess-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chess -d chess']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  chess-pgdata:
